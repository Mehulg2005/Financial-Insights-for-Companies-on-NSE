{% extends "base.html" %}

{% block title %}{{ nse_code }} · Overview{% endblock %}

{% block metrics %}

<div class="grid grid-cols-2 md:grid-cols-4 gap-4">

    <div class="summary-card bg-surface border border-border rounded-2xl p-5">
        <div class="font-mono text-[11px] uppercase tracking-widest text-text-muted mb-2">Revenue</div>
        <div id="cardRevenue" class="font-mono text-2xl font-semibold">-</div>
    </div>

    <div class="summary-card bg-surface border border-border rounded-2xl p-5">
        <div class="font-mono text-[11px] uppercase tracking-widest text-text-muted mb-2">Net Profit</div>
        <div id="cardNetProfit" class="font-mono text-2xl font-semibold">-</div>
    </div>

    <div class="summary-card bg-surface border border-border rounded-2xl p-5">
        <div class="font-mono text-[11px] uppercase tracking-widest text-text-muted mb-2">Earnings Per Share</div>
        <div id="cardEPS" class="font-mono text-2xl font-semibold">-</div>
    </div>

    <div class="summary-card bg-surface border border-border rounded-2xl p-5">
        <div class="font-mono text-[11px] uppercase tracking-widest text-text-muted mb-2">Operating Margin</div>
        <div id="cardOperatingMargin" class="font-mono text-2xl font-semibold">-</div>
    </div>

</div>

{% endblock %}

{% block content %}

<section class="bg-surface border border-border rounded-2xl p-5">

    <div class="flex items-center justify-between mb-4 flex-wrap gap-3">

        <h2 class="font-display font-semibold text-lg">Financial Disclosures</h2>

        <div class="flex border border-border rounded-lg overflow-hidden">

            <button type="button" class="preview-table-toggle active px-3 py-1.5 text-xs font-mono font-semibold text-text-medium" data-table="profit_loss">
                Profit &amp; Loss
            </button>

            <button type="button" class="preview-table-toggle px-3 py-1.5 text-xs font-mono font-semibold text-text-medium border-l border-border" data-table="balance_sheet">
                Balance Sheet
            </button>

            <button type="button" class="preview-table-toggle px-3 py-1.5 text-xs font-mono font-semibold text-text-medium border-l border-border" data-table="cash_flow">
                Cash Flow
            </button>

            <button type="button" class="preview-table-toggle px-3 py-1.5 text-xs font-mono font-semibold text-text-medium border-l border-border" data-table="quarterly_insights">
                Quarterly Insights
            </button>

        </div>

    </div>

    <div class="overflow-x-auto">
        <table class="w-full text-sm">
            <thead id="previewTableHead"></thead>
            <tbody id="previewTableBody"></tbody>
        </table>
    </div>

    <div class="mt-4 pt-4 border-t border-border text-right">
        <a href="/{{ nse_code }}/financials" class="font-mono text-xs font-semibold text-primary hover:text-primary-hover">
            View full history →
        </a>
    </div>

</section>

{% endblock %}

{% block scripts %}
<script src="/static/overview.js"></script>
{% endblock %}
